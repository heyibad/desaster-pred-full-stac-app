[project]
name = "disaster-backend"
version = "0.1.0"
description = "FastAPI backend for disaster prediction"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "sqlmodel>=0.0.21",
  "psycopg2-binary>=2.9.9",
  "python-jose[cryptography]>=3.3.0",
  "passlib[argon2]>=1.7.4",
  "argon2-cffi>=23.1.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "ultralytics>=8.1.0",
  "numpy<2",
  "pillow>=10.0.0",
  "torch==2.3.1",
  "torchvision==0.18.1",
]

[tool.uv]
index-url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
